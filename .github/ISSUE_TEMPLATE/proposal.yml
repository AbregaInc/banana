name: Change proposal
description: A change you want to make. Pull requests are accepted only for approved proposals.
labels: [proposal]
body:
  - type: textarea
    id: change
    attributes:
      label: The change
      description: What changes for the person using Banana, in a few sentences.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: How
      description: Where in the code, what it touches, how you'd test it. Performance-sensitive work names the workload and measurement.
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: I have read CONTRIBUTING.md and will sign the CLA before the pull request is reviewed.
          required: true
