name: CalendarSettingsReview
options:
  bundleIdPrefix: app.banana.mockup
  deploymentTarget:
    iOS: '26.1'
targets:
  CalendarSettingsReview:
    type: application
    platform: iOS
    sources: [CalendarSettingsReview.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.banana.mockup.calendarsettings
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: '6.0'
        TARGETED_DEVICE_FAMILY: '1,2'
