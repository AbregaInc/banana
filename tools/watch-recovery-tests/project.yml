name: WatchRecoveryTests
options:
  deploymentTarget:
    watchOS: "26.0"
# The team comes from Config/Local.xcconfig through Base.xcconfig, as in the main project.
configFiles:
  Debug: ../../Config/Base.xcconfig
  Release: ../../Config/Base.xcconfig
targets:
  WatchRecoveryUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchRecoveryUITests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boris.banana.watchreview.uitests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
schemes:
  WatchRecoveryUITests:
    build:
      targets:
        WatchRecoveryUITests: [test]
    test:
      config: Release
      targets:
        - WatchRecoveryUITests
