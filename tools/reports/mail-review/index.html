<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mail layout review</title>
  <link rel="stylesheet" href="/review.css">
  <script type="module" src="/review.js"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <div>
        <h1>Mail layout review</h1>
        <p id="progress">Loading newsletters…</p>
      </div>
      <nav id="cases" aria-label="Newsletters"></nav>
    </header>
    <section id="workspace" hidden aria-labelledby="case-title">
      <div class="case-bar">
        <h2 id="case-title"></h2>
        <div class="preview-controls">
          <button type="button" id="jump-change" disabled>Jump to change</button>
          <label>Preview width
            <select id="width">
              <option value="320">320 px</option>
              <option value="393" selected>393 px</option>
              <option value="480">480 px</option>
            </select>
          </label>
          <label class="check"><input id="images" type="checkbox"> Optional sample images</label>
        </div>
      </div>
      <div class="comparison" id="comparison"></div>
      <section class="feedback" aria-labelledby="notes-title">
        <div class="feedback-bar">
          <h3 id="notes-title">Notes</h3>
        </div>
        <ol id="notes"></ol>
      </section>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <dialog id="note-dialog" aria-labelledby="note-title">
    <form id="note-form">
      <h2 id="note-title">Add a note</h2>
      <p id="note-context"></p>
      <label for="note-body">What did you notice?</label>
      <textarea id="note-body" rows="4" required maxlength="2000"></textarea>
      <p id="note-error" role="alert"></p>
      <div class="form-actions">
        <button type="button" id="cancel-note">Cancel</button>
        <button type="submit" class="primary">Save note</button>
      </div>
    </form>
  </dialog>
</body>
</html>
