name: PiModelBench
options:
  deploymentTarget:
    iOS: "27.0"
configFiles:
  Debug: ../../Config/Local.xcconfig
  Release: ../../Config/Local.xcconfig
packages:
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: 991266ad300f47a3b9f21e62ff5bdb679215e758
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.0
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: $(BANANA_BUNDLE_ID).pi-model-bench
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  PiModelBench:
    type: application
    platform: iOS
    sources:
      - App.swift
      - ../../Banana/Pi/AppleFoundationModel.swift
      - path: requests.json
        buildPhase: resources
    dependencies:
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
      - package: MLXLM
        product: MLXFoundationModels
      - package: MLXLM
        product: MLXHuggingFace
      - package: Transformers
        product: Tokenizers
    info:
      path: ../../.build/sim/pi-model-bench/Info.plist
      properties:
        CFBundleDisplayName: Pi Model Bench
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
schemes:
  PiModelBench:
    build:
      targets:
        PiModelBench: all
