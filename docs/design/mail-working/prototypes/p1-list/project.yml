name: P1List
options:
  bundleIdPrefix: com.boris.banana.proto
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.1"
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

schemes:
  P1List:
    build:
      targets:
        P1List: all
        P1ListUITests: [test]
    test:
      config: Release
      targets:
        - P1ListUITests
    run:
      config: Release

targets:
  P1List:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: P1 List
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPrincipalClass: NSApplication
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boris.banana.proto.p1list
        PRODUCT_NAME: P1List
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OPTIMIZATION_LEVEL: "-O"
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule

  P1ListUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: UITests
    dependencies:
      - target: P1List
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boris.banana.proto.p1list.uitests
        TEST_TARGET_NAME: P1List
        GENERATE_INFOPLIST_FILE: YES
