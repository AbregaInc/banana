      - path: Banana/Model/Booking/BookingType.swift
      - path: Banana/Model/Booking/BookingHandle.swift
      - path: Banana/Model/Booking/BookingTypeStore.swift
      # The notification rule both delegates follow (iPhone and Mac).
      - path: Banana/Model/NotificationRoute.swift
      # What a booking push's tap asks the Plan to open, taken once.
      - path: Banana/Model/PlanOpenRequests.swift
      - path: Banana/Model/VoiceNote.swift
      - path: Shared/PlaybackSyncClock.swift
      - path: Shared/DataCatalog.json
        buildPhase: resources
      - path: Shared/SyncMergeFixtures.json
        buildPhase: resources
      # The sync protocol's request/answer pairs, made by running Service/src/space.js; the
      # service's suite runs the same file.
      - path: Shared/SyncProtocolFixtures.json
        buildPhase: resources
      - path: BananaTests/SyncFoundationTests.swift
      - path: BananaTests/SpaceSyncTests.swift
      - path: BananaTests/MemorySyncServer.swift
      - path: BananaTests/MoveOverTests.swift
      - path: BananaTests/ZoneListingTests.swift
      - path: BananaTests/LegacyCloudTests.swift
      - path: BananaTests/ICloudPurgeTests.swift
      # Every place that could write iCloud, listed with its gate (tools/icloud-write-sites.tsv).
      - path: BananaTests/ICloudWriteSitesTests.swift
      # Mail (docs/design/MAIL-ENGINE.md 17.3). The whole engine folder, and the pure half of
      # mail's UI, are compiled into the tests as DIRECTORIES — unlike everything above, which
      # is listed file by file. Mail is built a package at a time, and a file-by-file list
      # would make every one of those packages edit this file. The price is two rules the
      # folders keep: nothing in them may name anything outside them that is not also compiled
      # here; and only Swift files live in them. The `includes` keeps anything else out of this
      # bundle — but the four apps take the same folders through their own `Banana` entry, where
      # a stray .json would ship as a resource, so MailSourceTreeTests fails on one.
      - path: Banana/Model/Mail
        includes:
          - "**/*.swift"
      - path: Banana/Model/MailApp/MailCredentialStore.swift
      - path: Banana/Model/MailApp/MailGoogleAccess.swift
      - path: Banana/Model/MailApp/GmailHTTP.swift
      - path: Banana/Model/MailUI/Pure
        includes:
          - "**/*.swift"
    # The engine folder imports these two, so the bundle that compiles it links them.
    dependencies:
      - package: GRDB
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BANANA_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

  BananaWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: BananaWatch
      - path: Shared/WorkoutRecoveryCheckpoint.swift
      - path: Shared/WatchCalendarSnapshot.swift
      - path: Shared/FitnessModels.swift
      - path: Shared/DiagnosticsTracing.swift
      - path: Shared/WorkoutMediaRouting.swift
      - path: Shared/PlaybackSyncClock.swift
      - path: Shared/SnapshotPersistence.swift
      - path: Shared/JSONRecordStream.swift
      - path: Shared/WellnessModels.swift
      # Which built features are switched off, the same answer on the Watch as on the phone.
      - path: Shared/Features.swift
      - path: Shared/PlaybackSpeeds.swift
      - path: Shared/WorkoutPauses.swift
      - path: Shared/WorkoutRestTimer.swift
      # Quaternion <-> rotation-vector math for the orientation fallback in WorkoutRecorder.
      - path: Shared/RotationVector.swift
      # The Watch never builds a skip plan: it has neither a speech framework nor an on-device
      # model, and it plays only files already transferred to it. It consumes the plan the phone
      # computed, so it needs the plan type and the correction thresholds and nothing else.
      - path: Shared/PodcastSkipPlan.swift
      - path: Shared/PodcastSkipCorrections.swift
    info:
      path: BananaWatch/Info.plist
      properties:
        # Read by the code; filled from Config (see README).
        BananaTeamID: $(DEVELOPMENT_TEAM)
        CFBundleDisplayName: Banana
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: $(BANANA_BUNDLE_ID).watchkitapp
            CFBundleURLSchemes:
              - bananawatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BANANA_BUNDLE_ID)
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "Banana reads heart rate, energy, and distance during a workout so it can record your session."
        NSHealthUpdateUsageDescription: "Banana saves your recorded workouts to Apple Health."
        NSMotionUsageDescription: "Banana records motion during a workout for later analysis, and reads your steps at night to tell when you got up."
        NSMicrophoneUsageDescription: "Banana records quick voice notes on your wrist — capture a thought mid-run and it syncs to your iPhone with its context."
        NSLocationWhenInUseUsageDescription: "Banana records your route and speed during a workout."
    entitlements:
      path: BananaWatch/BananaWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        keychain-access-groups: [$(AppIdentifierPrefix)com.boris.banana.watch.calendar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BANANA_BUNDLE_ID).watchkitapp
        # The phone, iPad and Mac take the system's accent (no AccentColor asset there); a
        # Watch has no such setting, so it keeps its own orange.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BananaWatchWidget
        embed: true

  BananaWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: BananaWatchWidget
      - path: Shared/WatchCalendarSnapshot.swift
    info:
      path: BananaWatchWidget/Info.plist
      properties:
        # Read by the code; filled from Config (see README).
        BananaTeamID: $(DEVELOPMENT_TEAM)
        CFBundleDisplayName: Banana
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BANANA_BUNDLE_ID).watchkitapp.watchface
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
    entitlements:
      path: BananaWatchWidget/BananaWatchWidget.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.boris.banana.watch.calendar]

  BananaWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BananaWidget
      - path: Shared
        excludes:
          # The data platform’s files are the app’s, not the widget’s.
          - DataCatalog.json
          - SyncMergeFixtures.json
          - SyncProtocolFixtures.json
    info:
      path: BananaWidget/Info.plist
      properties:
        # Read by the code; filled from Config (see README).
        BananaTeamID: $(DEVELOPMENT_TEAM)
        CFBundleDisplayName: Banana
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BananaWidget/BananaWidget.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.boris.banana.widget.agenda]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BANANA_BUNDLE_ID).widget
        ENABLE_PREVIEWS: YES

  BananaMac:
    type: application
    platform: macOS
    sources:
      - path: tools/calendar-library-benchmark/Shared/Fixtures.swift
      - path: Banana
        excludes:
          - Assets.xcassets
          - Info.plist
          - Banana.entitlements
      - path: Shared
        excludes:
          # The merge and protocol cases are the tests’ (BananaTests), not the app’s.
          - SyncMergeFixtures.json
          - SyncProtocolFixtures.json
      - path: BananaMac/Assets.xcassets
    info:
      path: BananaMac/Info.plist
      properties:
        # Read by the code; filled from Config (see README).
        BananaTeamID: $(DEVELOPMENT_TEAM)
        BananaCloudContainer: $(BANANA_ICLOUD_CONTAINER)
        BananaLegacyCloudContainer: $(BANANA_LEGACY_ICLOUD_CONTAINER)
        # The Banana service (Service/) and the Google client it signs in with; empty in any
        # build but the official app.
        BananaServiceHost: $(BANANA_SERVICE_HOST)
        BananaGoogleServerClient: $(BANANA_GOOGLE_SERVER_CLIENT)
        CFBundleDisplayName: Banana
        GIDClientID: $(BANANA_GOOGLE_CLIENT).apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.$(BANANA_GOOGLE_CLIENT)
              - banananote
        # Same standard-crypto-only declaration as iOS; without it every Mac upload
        # re-asks the export-compliance question (build 7 was patched via API).
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleMusicUsageDescription: "Banana plays a playlist, album, or song from your Apple Music library when a routine starts."
        NSHealthShareUsageDescription: "Banana reads your workouts and health metrics from Apple Health so it can show and analyze your fitness in one place."
        NSHealthUpdateUsageDescription: "Banana saves workouts to Apple Health and updates them when you trim a workout."
        NSMicrophoneUsageDescription: "Banana records quick voice notes when you ask it to."
        NSCameraUsageDescription: "Banana uses the camera only when you choose to photograph a meal or a supplement label, or scan a barcode."
        NSContactsUsageDescription: "Banana looks up the people you type when adding guests to an event, so \u201CLunch with Sam\u201D can invite the Sam you mean."
        NSPhotoLibraryUsageDescription: "Banana looks for photos of meals — only when you turn on Find meal photos automatically — so it can ask what you ate and log it."
        # Apple's cloud model needs com.apple.developer.private-cloud-compute; true only once granted
        # and added to the entitlements (CloudModelGuard).
        BananaPrivateCloudCompute: false
        NSRemindersFullAccessUsageDescription: "Banana reads your reminders on-device so it can schedule tasks onto your day."
        NSLocationWhenInUseUsageDescription: "Banana uses your location for your local forecast."
        NSSpeechRecognitionUsageDescription: "Banana transcribes downloaded episodes on your device."
        NSLocalNetworkUsageDescription: "Banana finds your other Banana devices on this Wi-Fi so one downloaded podcast file can be reused without downloading it again."
        NSBonjourServices:
          - _banana-audio._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        # Same bundle id as iOS: shares the App Store record (universal purchase) and — key —
        # the com.boris.banana App ID that already has the iCloud containers associated, which
        # unblocks both Mac provisioning and a synced TestFlight build. The historical
        # com.boris.banana.mac id is retired; defaults migrate in BananaApp, and macOS asks
        # for calendar access once more under the new identity.
        PRODUCT_BUNDLE_IDENTIFIER: $(BANANA_BUNDLE_ID)
        # Without this the product is named after the TARGET, so CFBundleName becomes
        # "BananaMac" -- and CFBundleName is what the menu bar, System Settings > Privacy
        # and the App Store installer use. TestFlight installed it as
        # /Applications/BananaMac.app, and the Privacy entry to grant was called BananaMac
        # while Finder called it Banana.
        PRODUCT_NAME: Banana
        # Release is provisioned with iCloud so restore/settings sync work phone↔Mac.
        CODE_SIGN_ENTITLEMENTS: BananaMac/BananaMac.entitlements
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MAC_APP"
      configs:
        # Local Mac builds should not require a developer-portal provisioning profile.
        # Release retains BananaMac.entitlements so App Store builds keep iCloud sync.
        Debug:
          CODE_SIGN_ENTITLEMENTS: BananaMac/BananaMacDebug.entitlements
    dependencies:
      - package: FluidAudio
      - package: GoogleSignIn
      - package: GRDB
      - package: SwiftSoup

  # The test variant that coexists with prod on one Mac. Its own bundle id and display
  # name make macOS treat it as a separate app; BANANA_BETA diverts all local storage
  # into "Application Support/Banana Beta/" (see AppSupport.swift). Its iCloud entitlements
  # point only at the shared staging container used by iOS Beta, never production. Caveat:
  # system calendars, reminders, and notifications are still the real ones.
  BananaMacBeta:
    type: application
    platform: macOS
    sources:
      - path: tools/calendar-library-benchmark/Shared/Fixtures.swift
      - path: Banana
        excludes:
          - Assets.xcassets
          - Info.plist
          - Banana.entitlements
      - path: Shared
        excludes:
          # The merge and protocol cases are the tests’ (BananaTests), not the app’s.
          - SyncMergeFixtures.json
          - SyncProtocolFixtures.json
      - path: BananaMac/Assets.xcassets
    info:
      path: BananaMac/InfoBeta.plist
      properties:
        # Read by the code; filled from Config (see README).
        BananaTeamID: $(DEVELOPMENT_TEAM)
        BananaCloudContainer: $(BANANA_ICLOUD_CONTAINER_BETA)
        # Beta's own service and web client, never the production ones.
        BananaServiceHost: $(BANANA_SERVICE_HOST_BETA)
        BananaGoogleServerClient: $(BANANA_GOOGLE_SERVER_CLIENT_BETA)
        CFBundleDisplayName: Banana Beta
        # The same bundle id and Google client as the iPhone Beta, as Stable shares one across
        # iPhone and Mac: one Google client, and its sign-in shared through iCloud Keychain.
        GIDClientID: $(BANANA_GOOGLE_CLIENT_BETA).apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.$(BANANA_GOOGLE_CLIENT_BETA)
              - banananotebeta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        NSAppleMusicUsageDescription: "Banana Beta plays a playlist, album, or song from your Apple Music library when a routine starts."
        NSHealthShareUsageDescription: "Banana Beta reads your workouts and health metrics from Apple Health so it can show and analyze your fitness in one place."
        NSHealthUpdateUsageDescription: "Banana Beta saves workouts to Apple Health and updates them when you trim a workout."
        NSPhotoLibraryUsageDescription: "Banana Beta looks for photos of meals — only when you turn on Find meal photos automatically — so it can ask what you ate and log it."
        # Apple's cloud model needs com.apple.developer.private-cloud-compute; true only once granted
        # and added to the entitlements (CloudModelGuard).
        BananaPrivateCloudCompute: false
        NSMicrophoneUsageDescription: "Banana Beta records quick voice notes when you ask it to."
        NSCameraUsageDescription: "Banana Beta uses the camera only when you choose to photograph a meal or a supplement label, or scan a barcode."
        NSContactsUsageDescription: "Banana Beta looks up the people you type when adding guests to an event, so \u201CLunch with Sam\u201D can invite the Sam you mean."
        NSRemindersFullAccessUsageDescription: "Banana reads your reminders on-device so it can schedule tasks onto your day."
        NSLocationWhenInUseUsageDescription: "Banana uses your location for your local forecast."
        NSSpeechRecognitionUsageDescription: "Banana transcribes downloaded episodes on your device."
        NSLocalNetworkUsageDescription: "Banana finds your other Banana devices on this Wi-Fi so one downloaded podcast file can be reused without downloading it again."
        NSBonjourServices:
          - _banana-beta._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: BananaMac/BananaMacBeta.entitlements
      properties:
        # Notifications that should reach you through a Focus: leave-by, commute, event alerts,
        # bedtime, supplements. Without this entitlement `.timeSensitive` is silently downgraded.
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.weatherkit: true
        com.apple.developer.icloud-services: [CloudDocuments, CloudKit]
        com.apple.developer.icloud-container-identifiers: [$(BANANA_ICLOUD_CONTAINER_BETA)]
        com.apple.developer.ubiquity-container-identifiers: [$(BANANA_ICLOUD_CONTAINER_BETA)]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.boris.banana.beta
        keychain-access-groups: [$(AppIdentifierPrefix)$(CFBundleIdentifier)]
        # Silent pushes from the Beta's own Banana service (beta-api.bananatheapp.com).
        com.apple.developer.aps-environment: development
    settings:
      base:
        # Was $(BANANA_BUNDLE_ID).mac.beta until 18 Oct 2026 (defaults carried over at launch).
        PRODUCT_BUNDLE_IDENTIFIER: $(BANANA_BUNDLE_ID).beta
        PRODUCT_NAME: Banana Beta
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconBeta
        # MAIL_FIXTURES: as on BananaBeta. Neither production target has it.
        BANANA_UNRELEASED: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MAC_APP BANANA_BETA MAIL_FIXTURES"
    dependencies:
      - package: FluidAudio
      - package: GoogleSignIn
      - package: GRDB
      - package: SwiftSoup
