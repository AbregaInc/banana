name: Banana
options:
  bundleIdPrefix: $(BANANA_BUNDLE_ID)
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.1"
    macOS: "26.0"

schemes:
  BananaModelTests:
    build:
      targets:
        BananaTests: [test]
    test:
      config: Release
      targets:
        - BananaTests
  BananaNativePerformanceUITests:
    build:
      targets:
        BananaNativePerformanceUITests: [test]
    test:
      config: Release
      targets:
        - BananaNativePerformanceUITests
  Banana:
    build:
      targets:
        Banana: all
        BananaUITests: [test]
    test:
      config: Debug
      targets:
        - BananaTests
        - BananaUITests
    run:
      config: Debug
    archive:
      config: Release
  BananaMac:
    build:
      targets:
        BananaMac: all
    run:
      config: Debug
  BananaMacBeta:
    build:
      targets:
        BananaMacBeta: all
    run:
      config: Debug
  # The Mac's keyboard-and-mouse UI tests (BananaMacUITests/). Its own scheme and nothing else's:
  # they launch the Beta on the owner's desktop and take his keyboard, so no other scheme builds or
  # runs them. Debug, because the launch routes they use (`--mail-fresh`, `--mail-open`,
  # `--mail-state`) are compiled into Debug only. Run it with tools/mac-mail-uitest.sh.
  BananaMacBetaUITests:
    build:
      targets:
        BananaMacBeta: all
        BananaMacUITests: [test]
    test:
      config: Debug
      targets:
        - BananaMacUITests
    run:
      config: Debug
  BananaBeta:
    build:
      targets:
        BananaBeta: all
    run:
      config: Debug
  BananaWatch:
    build:
      targets:
        BananaWatch: all
    run:
      config: Debug
  BananaWidgetExtension:
    build:
      targets:
        BananaWidgetExtension: all
    run:
      config: Debug

# The team that signs and the names only one developer account can own (bundle id, iCloud
# container, Google sign-in client) are not in this file: Config/Base.xcconfig holds stand-ins
# and reads your own from Config/Local.xcconfig, which is not tracked. See README.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "83"
    CODE_SIGN_STYLE: Automatic
    # Native Mac apps and test hosts support Apple silicon only. iOS settings are unchanged.
    "ARCHS[sdk=macosx*]": arm64
    # iPhone and iPad: one app, laid out by the room it has (see docs/design/ADAPTIVE-LAYOUT.md).
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.5
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 9.1.0
  # Mail's two libraries (docs/design/MAIL-ENGINE.md, decision D19). Pinned to a REVISION, not
  # to a version as the two above are. A version names a tag, and a tag can be moved to other
  # code; a revision is the code. These direct revisions remain explicit here, with their
  # tagged versions beside them. Config/Package.resolved retains reviewed direct/transitive
  # pins outside the generated project; copy it into the generated workspace as described
  # in README.md. Upgrade source pins and resolved revisions together, deliberately, with
  # updated notices and a re-measurement behind implementation/dependency changes.
  #
  # GRDB is the door to mail's SQLite stores. It links the SYSTEM's SQLite (its `GRDBSQLite`
  # target is a module map over /usr/lib/libsqlite3, with no SQLite of its own), which is the
  # same library FoodDatabase.swift and BarcodeProductLookup.swift already call directly — one
  # SQLite in the process, two ways of calling it, no second copy to clash with.
  #
  # SwiftSoup parses a message's HTML, behind mail's own sanitiser.
  #
  # Both go to the four apps and the unit tests ONLY. Not the Watch, not the widgets: mail does
  # not run there, and neither may anything it links.
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    revision: b83108d10f42680d78f23fe4d4d80fc88dab3212   # v7.11.1
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    revision: 18b80329749eca5ea29fc50211dca5c7eff5bfec   # 2.13.9

targets:
  Banana:
    type: application
    platform: iOS
    sources:
      - path: tools/calendar-library-benchmark/Shared/Fixtures.swift
      - path: Banana
      - path: Shared
        excludes:
          # The merge and protocol cases are the tests’ (BananaTests), not the app’s.
          - SyncMergeFixtures.json
          - SyncProtocolFixtures.json
      # The widget views, for the `--widgets` debug gallery.
      - path: BananaWidget/AgendaWidgets.swift
    info:
      path: Banana/Info.plist
      properties:
        # Read by the code; filled from Config (see README).
        BananaTeamID: $(DEVELOPMENT_TEAM)
        BananaCloudContainer: $(BANANA_ICLOUD_CONTAINER)
        BananaLegacyCloudContainer: $(BANANA_LEGACY_ICLOUD_CONTAINER)
        # The Banana service (Service/) and the Google client it signs in with; empty in any
        # build but the official app.
        BananaServiceHost: $(BANANA_SERVICE_HOST)
        BananaGoogleServerClient: $(BANANA_GOOGLE_SERVER_CLIENT)
        CFBundleDisplayName: Banana
        GIDClientID: $(BANANA_GOOGLE_CLIENT).apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.$(BANANA_GOOGLE_CLIENT)
              - banananote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Launch screen matches the app's grouped background, so launch → first frame doesn't
        # flash white before the UI paints.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Unlock the full ProMotion range for UIKit, SwiftUI, and Core Animation. Without this
        # opt-in, iPhone caps the Day scroll below the display's supported refresh rate.
        CADisableMinimumFrameDurationOnPhone: true
        NSAlarmKitUsageDescription: "Banana schedules alarms so it can wake you at the times you turn on — ringing through silent mode and Focus, even when the app is closed."
        NSAppleMusicUsageDescription: "Banana plays a playlist, album, or song from your Apple Music library as your wake-up sound after an alarm."
        NSRemindersFullAccessUsageDescription: "Banana reads your reminders on-device so it can schedule tasks onto your day alongside your routines and meetings."
        NSLocationWhenInUseUsageDescription: "Banana uses your location for forecasts, travel estimates, and—when you explicitly enable it—a route recorded only while a podcast is playing."
        # "Learn from my trips" (Settings › Travel) asks for Always location and Motion. Without
        # these two iOS ignores the first request and kills the app on the second, and App Store
        # Connect refuses the build (ITMS-90683) — which is how their absence was found.
        NSLocationAlwaysAndWhenInUseUsageDescription: "Banana notes where you arrive and leave — only when you turn on Learn from my trips — so travel times match how long your trips really take. The visits stay on this iPhone."
        NSMotionUsageDescription: "Banana reads whether you were on foot or in a vehicle — only when you turn on Learn from my trips — so it learns your real pace for each way of travelling."
        NSHealthShareUsageDescription: "Banana reads your workouts and health metrics from Apple Health — including sessions recorded by other apps and devices — so it can show and analyze your fitness in one place."
        NSHealthUpdateUsageDescription: "Banana saves your Watch-recorded workouts to Apple Health — including the route — and updates them when you trim a workout."
        UIBackgroundModes:
          - audio
          - processing
          # BGAppRefreshTaskRequest (calendar write-back below) needs "fetch"; BGProcessingTaskRequest
          # (feed refresh, transcription) needs "processing" — both must be declared for their
          # respective task types to actually run.
          - fetch
          - location
          # Silent pushes for the meal backlog's zone (MealBacklogWake): a meal the Mac found wakes
          # the iPhone for a few seconds to fetch it and ask about it. Inert without aps-environment.
          - remote-notification
        # Required for the AlarmKit alert Live Activity and the continued-processing
        # transcription activity to actually present — was silently missing.
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.boris.banana.transcribe.overnight
          # Overnight feed refresh + auto-downloads + Watch backfill (charger + network).
          - com.boris.banana.feeds.overnight
          # iOS 26 continued-processing: identifiers MUST be wildcarded and prefixed with the
          # bundle ID. This is what lets a user-initiated transcription keep running (with a Live
          # Activity) after you leave the app, instead of waiting for an overnight window.
          - com.boris.banana.transcribe.*
          # Calendar write-back: re-syncs busy blocks (incl. travel/return-home holds) across the
          # 31-day write-back horizon while the app is backgrounded, so a Calendly booking landing
          # in that gap still gets covered without the person having to open Banana first.
          - com.boris.banana.calendar.refresh
          # "Find meal photos automatically": looks through new photos for meals about hourly while
          # the app is closed (MealPhotoScanner), so each can ask what it was.
          - com.boris.banana.meals.scan
          # Meals someone just asked for keep being estimated after they leave the app (iOS 26
          # continued processing, wildcarded like transcription), and anything left waiting is
          # estimated on the next charge.
          - com.boris.banana.meals.estimate.*
          - com.boris.banana.meals.catchup
        NSPhotoLibraryUsageDescription: "Banana looks for photos of meals — only when you turn on Find meal photos automatically — so it can ask what you ate and log it."
        # Apple's cloud model needs com.apple.developer.private-cloud-compute; true only once granted
        # and added to the entitlements (CloudModelGuard).
        BananaPrivateCloudCompute: false
        NSSpeechRecognitionUsageDescription: "Banana transcribes downloaded episodes on your device so you can follow along word-by-word while listening."
        NSMicrophoneUsageDescription: "Banana records quick voice notes — pause a podcast, capture a thought, and it's saved with the moment it came from for later."
        NSCameraUsageDescription: "Banana uses the camera only when you choose to photograph a meal or a supplement label, or scan a food or supplement barcode."
        NSContactsUsageDescription: "Banana looks up the people you type when adding guests to an event, so \u201CLunch with Sam\u201D can invite the Sam you mean."
        NSLocalNetworkUsageDescription: "Banana finds your other Banana devices on this Wi-Fi so one downloaded podcast file can be reused without downloading it again."
        NSBonjourServices:
          - _banana-audio._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true      # podcast feeds/audio are still served over plain HTTP
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Banana/Banana.entitlements
      properties:
        # The app's own group stays FIRST: it is the default for every keychain write that does
        # not name a group (Google accounts, tokens), exactly as before this list existed. The
        # second is shared with the widget extension — the agenda the calendar widgets draw.
        # Team-prefixed keychain groups need no developer-portal registration (App Groups do).
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.boris.banana
          - $(AppIdentifierPrefix)com.boris.banana.widget.agenda
        # Notifications that should reach you through a Focus: leave-by, commute, event alerts,
        # bedtime, supplements. Without this entitlement `.timeSensitive` is silently downgraded.
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.weatherkit: true
        com.apple.developer.icloud-services: [CloudDocuments, CloudKit]
        com.apple.developer.icloud-container-identifiers: [$(BANANA_ICLOUD_CONTAINER)]
        # Direct production installs must use the same private CloudKit database as TestFlight
        # and the production Mac app; otherwise an Xcode development default splits sync.
        com.apple.developer.icloud-container-environment: Production
        # Silent pushes for the meal backlog's zone (MealBacklogWake). Development for the
        # development-signed builds installed directly; an App Store export rewrites it to production.
        aps-environment: development
        # Apple's cloud model (PrivateCloudComputeLanguageModel) needs the managed entitlement
        # com.apple.developer.private-cloud-compute, granted on request
        # (developer.apple.com/private-cloud-compute). Without it the model reports itself available
        # and the first request crashes the app. When Apple grants it: add it here and set
        # BananaPrivateCloudCompute to true in both Info.plists (CloudModelGuard).
        com.apple.developer.ubiquity-container-identifiers: [$(BANANA_ICLOUD_CONTAINER)]
        # Shared key-value store — the SAME identifier on iOS and Mac (not the default
        # per-bundle one), so phone↔Mac settings actually land in one store.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.boris.banana
    settings:
      base:
        BANANA_UNRELEASED: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BANANA_BUNDLE_ID)
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # A normal Release build must be the public app; Debug retains test fixtures.
          BANANA_UNRELEASED: NO
    dependencies:
      - package: FluidAudio
      - package: GoogleSignIn
      - package: GRDB
      - package: SwiftSoup
      - target: BananaWidgetExtension
      - target: BananaWatch
        embed: true

  # The iOS twin of BananaMacBeta: the build that gets TESTED, so the build you USE is never
  # the one under test. Distinct bundle id, so it has its own data container, its own TCC
  # permission grants, and its own icon on the Home Screen — nothing it does can reach the
  # production app.
  #
  # Deliberately embeds neither the Watch app nor the widget extension: both are singletons
  # keyed by bundle id, and a second copy would fight the production ones for the same slot.
  # Watch and widget work is done against the production target, on purpose and out loud.
  BananaBeta:
    type: application
    platform: iOS
    sources:
      - path: tools/calendar-library-benchmark/Shared/Fixtures.swift
      - path: Banana
        excludes:
          - Info.plist
      - path: Shared
        excludes:
          # The merge and protocol cases are the tests’ (BananaTests), not the app’s.
          - SyncMergeFixtures.json
          - SyncProtocolFixtures.json
      - path: BananaWidget/AgendaWidgets.swift
    info:
      path: Banana/InfoBeta.plist
      properties:
        # Read by the code; filled from Config (see README).
        BananaTeamID: $(DEVELOPMENT_TEAM)
        BananaCloudContainer: $(BANANA_ICLOUD_CONTAINER_BETA)
        # Beta's own service and web client, never the production ones.
        BananaServiceHost: $(BANANA_SERVICE_HOST_BETA)
        BananaGoogleServerClient: $(BANANA_GOOGLE_SERVER_CLIENT_BETA)
        CFBundleDisplayName: Banana Beta
        GIDClientID: $(BANANA_GOOGLE_CLIENT_BETA).apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.$(BANANA_GOOGLE_CLIENT_BETA)
              - banananotebeta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CADisableMinimumFrameDurationOnPhone: true
        UIBackgroundModes:
          - audio
          - processing
          - fetch
          - location
          - remote-notification
        # Beta previously declared no BGTaskSchedulerPermittedIdentifiers at all, so
        # OvernightRefresh/TranscriptCoordinator's calls to BGTaskScheduler.register(forTaskWithIdentifier:)
        # were silently permitted-but-inert in beta builds (the identifier isn't in this Info.plist,
        # so the task can never actually be scheduled). Mirrored from the Banana target below —
        # fixes that gap for the existing tasks too, not just the new one.
        BGTaskSchedulerPermittedIdentifiers:
          - com.boris.banana.transcribe.overnight
          - com.boris.banana.feeds.overnight
          - com.boris.banana.transcribe.*
          - com.boris.banana.calendar.refresh
          - com.boris.banana.meals.scan
          # Meals someone just asked for keep being estimated after they leave the app (iOS 26
          # continued processing, wildcarded like transcription), and anything left waiting is
          # estimated on the next charge.
          - com.boris.banana.meals.estimate.*
          - com.boris.banana.meals.catchup
        NSSupportsLiveActivities: true
        NSPhotoLibraryUsageDescription: "Banana Beta looks for photos of meals — only when you turn on Find meal photos automatically — so it can ask what you ate and log it."
        # Apple's cloud model needs com.apple.developer.private-cloud-compute; true only once granted
        # and added to the entitlements (CloudModelGuard).
        BananaPrivateCloudCompute: false
        NSAlarmKitUsageDescription: "Banana Beta schedules alarms so it can wake you at the times you turn on — ringing through silent mode and Focus, even when the app is closed."
        NSAppleMusicUsageDescription: "Banana Beta plays a playlist, album, or song from your Apple Music library as your wake-up sound after an alarm."
        NSRemindersFullAccessUsageDescription: "Banana Beta reads your reminders on-device so it can schedule tasks onto your day."
        NSLocationWhenInUseUsageDescription: "Banana Beta uses your location for your local forecast and travel estimates."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Banana Beta notes where you arrive and leave — only when you turn on Learn from my trips — so travel times match how long your trips really take."
        NSMotionUsageDescription: "Banana Beta reads whether you were on foot or in a vehicle — only when you turn on Learn from my trips."
        NSHealthShareUsageDescription: "Banana Beta reads your workouts and health metrics from Apple Health so it can show and analyze your fitness in one place."
        NSHealthUpdateUsageDescription: "Banana Beta saves workouts recorded with Banana to Apple Health and updates them when you trim a workout."
        NSSpeechRecognitionUsageDescription: "Banana Beta transcribes downloaded episodes on your device."
        NSMicrophoneUsageDescription: "Banana Beta records quick voice notes."
        NSCameraUsageDescription: "Banana Beta uses the camera only when you choose to photograph a meal or a supplement label, or scan a food or supplement barcode."
        NSContactsUsageDescription: "Banana Beta looks up the people you type when adding guests to an event, so \u201CLunch with Sam\u201D can invite the Sam you mean."
        NSLocalNetworkUsageDescription: "Banana Beta finds your other Banana devices on this Wi-Fi."
        NSBonjourServices:
          - _banana-beta._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Banana/BananaBeta.entitlements
      properties:
        # Notifications that should reach you through a Focus: leave-by, commute, event alerts,
        # bedtime, supplements. Without this entitlement `.timeSensitive` is silently downgraded.
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.weatherkit: true
        com.apple.developer.icloud-services: [CloudDocuments, CloudKit]
        com.apple.developer.icloud-container-identifiers: [$(BANANA_ICLOUD_CONTAINER_BETA)]
        com.apple.developer.ubiquity-container-identifiers: [$(BANANA_ICLOUD_CONTAINER_BETA)]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.boris.banana.beta
        # Silent pushes from the Beta's own Banana service (beta-api.bananatheapp.com).
        aps-environment: development
        # Beta uses only the staging iCloud namespace above. HealthKit is enabled under beta's
        # distinct App ID so every permission flow can be tested; beta still embeds no Watch app.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BANANA_BUNDLE_ID).beta
        PRODUCT_NAME: Banana Beta
        # One module name for both apps: code that says `Banana.calendarTint` to get past a
        # member of the same name didn't compile in Beta, whose module was "Banana_Beta".
        PRODUCT_MODULE_NAME: Banana
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconBeta
        # MAIL_FIXTURES: the sample mailbox (Banana/Model/MailUI/Pure/Testing/), in this target's Release
        # as well as its Debug. The owner's Beta is a Release build and is how he tries Mail.
        # Neither production target has it, so production has no sample mail.
        BANANA_UNRELEASED: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BANANA_BETA MAIL_FIXTURES"
    dependencies:
      - package: FluidAudio
      - package: GoogleSignIn
      - package: GRDB
      - package: SwiftSoup

  BananaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BananaUITests
      # Mail's accessibility identifiers, the SAME files the views use, so that a UI test never
      # retypes a string a view spells. Only the identifier files: this bundle has nothing else
      # of the app's, which is why those files may name Foundation and nothing more.
      - path: Banana/Model/MailUI/Pure
        includes:
          - "MailIdentifiers*.swift"
    dependencies:
      - target: Banana
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BANANA_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Banana
        GENERATE_INFOPLIST_FILE: YES

  # Mac UI tests: they press real keys and drag real windows in the Beta (BananaMacBeta), so they
  # only run through the BananaMacBetaUITests scheme, by tools/mac-mail-uitest.sh, with the owner's
  # say. Same arrangement as BananaUITests: the identifier files of Mail are the SAME files the views
  # use, and MailArrangement.swift (Foundation only) is the one place the column breakpoints are
  # written, so the window-size cases hold the app to the number it declares.
  BananaNativePerformanceUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: BananaNativePerformanceUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boris.banana.mac.native-performance.uitests
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "Apple Development"

  BananaMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: BananaMacUITests
      - path: Banana/Model/MailUI/Pure
        includes:
          - "MailIdentifiers*.swift"
          - "MailArrangement.swift"
    dependencies:
      - target: BananaMacBeta
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boris.banana.mac.beta.uitests
        TEST_TARGET_NAME: BananaMacBeta
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: ""

  BananaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BananaTests
      - path: Banana/Model/HealthAuthorization.swift
      # Snapshot decode-and-quarantine (the data-safety sweep across every on-disk JSON store) —
      # SnapshotPersistence.swift is the shared, store-agnostic loader; WellnessModels.swift now
      # builds on it. WatchAudioQuality.swift/Podcast.swift and ListenEvent.swift are the pure
      # storage-shaped models for PodcastLibrary/ListenHistoryStore — split out (same reasoning
      # as DistanceUnit.swift below) so their decode-and-quarantine tests don't also pull in
      # PodcastLibrary/ListenHistoryStore's own CloudBackup/CloudKit dependency chain.
      - path: Shared/SnapshotPersistence.swift
      - path: Shared/WorkoutRecoveryCheckpoint.swift
      - path: BananaWatch/SampleWriter.swift
      - path: Banana/Model/NoteReminderWriter.swift
      - path: Shared/JSONRecordStream.swift
      - path: Shared/WellnessModels.swift
      - path: Banana/Model/WatchAudioQuality.swift
      - path: Banana/Model/Podcast.swift
      - path: Banana/Model/FeedTranscriptParser.swift
      - path: Banana/Model/EpisodeOwnership.swift
      - path: Banana/Model/PodcastCatalog.swift
      - path: Banana/Model/PodcastEpisodeBrowser.swift
      - path: Banana/Model/FeedParser.swift
      - path: Banana/Model/VoiceNote.swift
      - path: Banana/Model/LiveFilter.swift
      - path: Shared/LiveFilterRules.json
        buildPhase: resources
      - path: Banana/Model/NoteRepository.swift
      - path: Banana/Model/NoteQueryCache.swift
      - path: Banana/Model/TimeRangeIndex.swift
      - path: Banana/Model/ListenEvent.swift
      - path: Banana/Model/BarcodeProductLookup.swift
      - path: Banana/Model/Credits.swift
      # Barcode network fallback caches Open Food Facts hits under AppSupport.directory — the
      # file itself is self-contained (Foundation + Security only), unlike the AppSupport-using
      # chain the comment below routes around.
      # Voice verdicts per narrator, including hand corrections. Takes its directory as a
      # parameter, so every case here runs against a throwaway folder.
      - path: Banana/Model/NarratorVoiceStore.swift
      - path: Banana/Model/AppSupport.swift
      - path: Banana/Model/CalendarEventTitlePolicy.swift
      - path: Banana/Model/CalendarWriteBackPolicy.swift
      - path: Banana/Model/TravelBlockPolicy.swift
      # Confirmed places, the per-trip mode rule, and what a travel block says. Pure.
      - path: Banana/Model/TravelPlaces.swift
      # 5-minute time-entry grid — FiveMinuteGrid.snapped is pure (Foundation only); the
      # UIKit-backed FiveMinuteTimeWheel control in the same file compiles fine alongside it
      # since this test target's platform is iOS too.
      - path: Banana/Views/FiveMinuteTimeWheel.swift
      - path: BananaTests/FiveMinuteGridTests.swift
      - path: Shared/FitnessModels.swift
      - path: Shared/WorkoutMotionAnalysis.swift
